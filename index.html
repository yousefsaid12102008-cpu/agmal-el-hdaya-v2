
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGAML EL HDAYA ERP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/auth.css">
  <link rel="stylesheet" href="src/styles/dashboard.css">
  <link rel="stylesheet" href="src/styles/tables.css">
  <link rel="stylesheet" href="src/styles/print.css">

  <style>
    body {
      margin: 0;
      background: #060a13;
      color: white;
      font-family: Cairo, sans-serif;
    }

    #appLoader {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      color: #e9bd72;
    }

    .loader-circle {
      width: 38px;
      height: 38px;
      border: 3px solid #343434;
      border-top-color: #e9bd72;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #appError {
      padding: 30px;
      color: #ff7777;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="appLoader">
      <div class="loader-circle"></div>
      <div class="app-loader-message">جاري تشغيل النظام...</div>
    </div>

    <main id="appContent" hidden></main>

    <div id="appError" hidden>
      <h2>حدث خطأ أثناء تشغيل النظام</h2>
      <p id="appErrorMessage"></p>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>

</body>
</html>
