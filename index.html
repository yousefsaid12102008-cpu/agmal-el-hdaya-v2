
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1424">
  <title>أجمل الهدايا | تسجيل الدخول</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #09111f;
      color: #f7f8fb;
      font-family: system-ui, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #29364a;
      border-radius: 22px;
      background: #111d30;
      box-shadow: 0 18px 55px #0005;
    }
    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #d4af37;
      color: #09111f;
      font-size: 30px;
    }
    h1, .subtitle { text-align: center; }
    h1 { font-size: 24px; margin: 8px 0; }
    .subtitle { color: #aab7ca; font-size: 14px; margin-bottom: 24px; }
    label { display: block; margin: 14px 0 7px; font-size: 14px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #34435b;
      border-radius: 10px;
      background: #0b1424;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #d4af37; }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #d4af37;
      color: #111827;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button.secondary {
      background: #1c2a40;
      color: white;
      border: 1px solid #34435b;
    }
    #message {
      margin-top: 16px;
      color: #f5d779;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }
    .note { color: #94a3b8; font-size: 12px; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">✦</div>
    <h1>مكتبة أجمل الهدايا</h1>
    <p class="subtitle">أهلاً بك في نظام إدارة المكتبة</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="name@example.com" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
        autocomplete="current-password" placeholder="كلمة المرور" required>

      <button type="submit">تسجيل الدخول</button>
    </form>

    <button id="showSignup" class="secondary" type="button">
      إنشاء حساب جديد
    </button>

    <div id="signupFields" hidden>
      <label for="displayName">الاسم الكامل</label>
      <input id="displayName" type="text"
        autocomplete="name" placeholder="اكتب اسمك">

      <button id="signupButton" type="button">إنشاء الحساب</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
    <p class="note">الحسابات الجديدة تحتاج إلى موافقة الإدارة قبل الدخول للنظام.</p>
  </main>

  <script type="module" src="./assets/js/auth.js"></script>
</body>
</html>
